#github actions workflow
#github automatically looks for workflow files in the .github/workflows 
#give workflow a meaningful name

name: Iris ML-api CI pipeline
#define when github should run this workflow

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run API tests
    #github provides a fresh ubuntu runner for each job
    runs-on: ubuntu-latest
    steps:
      #download the repo content to the runner
      - name: Checkout repo
        uses: actions/checkout@v4

      # step 2: installn python on runner
      - name: Install Python on Runner
        uses: actions/setup-python@v5
        with:
          python-version: 3.14
      #step 3: install dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # step 4: run the automated tests
      - name: Run the automated tests
        run: python -m pytest -v

#build and publish docker image to github container registry
  build:
    name: Build and publish docker image
    needs: test
    runs-on: ubuntu-latest
#publish only when the code is pushed to main
    if: github.event_name == 'push' && github.ref == 'ref/heads/main'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      #enable docker buildkit functionality
      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v3

      #authenticate to github container registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      #build and publish docker image to github container registry
      - name: generate docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw, value=latest
            type=sha, format=short

#build the docker image and push it to ghcr
      - name: Build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
